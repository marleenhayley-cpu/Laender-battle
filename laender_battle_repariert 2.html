<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Länder-Battle – Testversion</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#101522;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;text-align:center}
main{max-width:760px;margin:auto;padding:14px}
h1{font-size:25px;margin:8px 0 4px} p{color:#cbd3e3;margin:5px 0 12px;font-size:14px}
canvas{display:block;width:100%;height:auto;background:#1b2435;border:2px solid #65718a;border-radius:14px;touch-action:manipulation}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
button,select{font-size:16px;border:0;border-radius:12px;padding:12px 14px;background:#33415f;color:white}
button.primary{background:#5a67f2} button:active{transform:scale(.98)}
#status{background:#1b2435;border-radius:12px;padding:10px;font-size:14px;color:#e4e9f5}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.legend span{padding:8px 4px;border-radius:8px;font-size:13px;font-weight:700}
small{display:block;color:#aeb8cb;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<main>
<h1>🌍 Länder-Battle</h1>
<p>Testversion · Wähle ein Land und füge Kugeln hinzu!</p>
<canvas id="game" width="600" height="600" aria-label="Länder-Battle Spielfeld"></canvas>
<div class="legend" id="legend"></div>
<div class="controls">
<select id="country" aria-label="Land auswählen">
<option value="0">🇩🇪 Deutschland</option><option value="1">🇫🇷 Frankreich</option><option value="2">🇯🇵 Japan</option><option value="3">🇧🇷 Brasilien</option><option value="4">🇺🇸 USA</option><option value="5">🇮🇹 Italien</option>
</select>
<button class="primary" id="add">➕ Kugel hinzufügen</button>
<button id="boost">💥 Super-Schuss</button>
<button id="reset">↻ Neustart</button>
</div>
<div id="status">Spielfeld wird geladen …</div>
<small>Hinweis: Dies ist zunächst ein spielbarer Prototyp. TikTok-LIVE-Kommentare, echte Profilbilder und echte Geschenk-Events sind noch nicht verbunden.</small>
</main>
<script>
(() => {
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const status=document.getElementById('status'), select=document.getElementById('country');
const countries=[
{name:'Deutschland',flag:'🇩🇪',color:'#f2c94c'},
{name:'Frankreich',flag:'🇫🇷',color:'#4d8df5'},
{name:'Japan',flag:'🇯🇵',color:'#f16d7a'},
{name:'Brasilien',flag:'🇧🇷',color:'#45c486'},
{name:'USA',flag:'🇺🇸',color:'#ad83ff'},
{name:'Italien',flag:'🇮🇹',color:'#ff9b53'}
];
const W=600,H=600,cx=300,cy=300;
let blocks=[],balls=[],tick=0,alive=countries.map(()=>true),running=true;
const legend=document.getElementById('legend');
legend.innerHTML=countries.map(c=>`<span style="background:${c.color};color:#111">${c.flag} ${c.name}</span>`).join('');
function zone(x,y){let a=Math.atan2(y-cy,x-cx); if(a<0)a+=Math.PI*2; return Math.floor(a/(Math.PI*2/6));}
function makeBlocks(){
 blocks=[];
 // Build visible, dense square tiles in a circular arena, colored by the nearest angular country sector.
 for(let y=44;y<560;y+=22) for(let x=44;x<560;x+=22){
  const dx=x+9-cx,dy=y+9-cy;
  if(dx*dx+dy*dy<248*248){
   const z=zone(x+9,y+9);
   blocks.push({x,y,w:17,h:17,z,hp:1});
  }
 }
}
function addBall(country, n=1){
 for(let i=0;i<n;i++){
  const angle=Math.random()*Math.PI*2, r=20+Math.random()*35;
  balls.push({x:cx+Math.cos(angle)*r,y:cy+Math.sin(angle)*r,vx:(Math.random()-.5)*3.8,vy:(Math.random()-.5)*3.8,r:9,z:country,color:countries[country].color});
 }
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // dark arena and country wedges, always drawn behind the blocks
 ctx.fillStyle='#202a3d';ctx.fillRect(0,0,W,H);
 for(let z=0;z<6;z++){
  const start=z*Math.PI/3, end=(z+1)*Math.PI/3;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,255,start,end);ctx.closePath();
  ctx.fillStyle=countries[z].color;ctx.globalAlpha=.20;ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle=countries[z].color;ctx.lineWidth=3;ctx.stroke();
  const a=(start+end)/2;
  ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.textAlign='center';
  ctx.fillText(countries[z].flag+' '+countries[z].name,cx+Math.cos(a)*170,cy+Math.sin(a)*170);
 }
 // tile blocks
 for(const b of blocks){
  ctx.fillStyle=countries[b.z].color;ctx.globalAlpha=.95;
  ctx.fillRect(b.x,b.y,b.w,b.h);ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(15,20,32,.75)';ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(b.x+3,b.y+3,b.w-6,3);
 }
 // outer wall
 ctx.beginPath();ctx.arc(cx,cy,255,0,Math.PI*2);ctx.strokeStyle='#dbe4f7';ctx.lineWidth=4;ctx.stroke();
 for(const b of balls){
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=b.color;ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle='#111';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(countries[b.z].flag,b.x,b.y+1);
 }
}
function update(){
 if(!running)return;
 tick++;
 for(const b of balls){
  b.x+=b.vx;b.y+=b.vy;
  const dx=b.x-cx,dy=b.y-cy,dist=Math.hypot(dx,dy);
  if(dist>247){const nx=dx/(dist||1),ny=dy/(dist||1);b.x=cx+nx*247;b.y=cy+ny*247;const dot=b.vx*nx+b.vy*ny;b.vx-=2*dot*nx;b.vy-=2*dot*ny;}
  // Keep motion alive
  b.vx+=(Math.random()-.5)*.08;b.vy+=(Math.random()-.5)*.08;
  const speed=Math.hypot(b.vx,b.vy);if(speed>4.5){b.vx*=4.5/speed;b.vy*=4.5/speed;} if(speed<1){b.vx+=.25;b.vy-=.15;}
  // destroy tiles belonging to the ball's country when it touches them
  for(let i=blocks.length-1;i>=0;i--){
   const k=blocks[i];if(k.z===b.z&&b.x+b.r>k.x&&b.x-b.r<k.x+k.w&&b.y+b.r>k.y&&b.y-b.r<k.y+k.h){blocks.splice(i,1);b.vx*=1.05;b.vy*=1.05;break;}
  }
 }
 for(let z=0;z<6;z++) alive[z]=blocks.some(b=>b.z===z);
 const survivors=alive.filter(Boolean).length;
 status.textContent=`🧱 Verbleibende Blöcke: ${blocks.length} · ⚽ Kugeln: ${balls.length} · 🏆 Länder mit Blöcken: ${survivors}`;
 if(survivors===1){const winner=alive.findIndex(Boolean);status.textContent=`🏆 ${countries[winner].flag} ${countries[winner].name} ist aktuell das letzte Land mit Blöcken!`;}
 draw();requestAnimationFrame(update);
}
document.getElementById('add').addEventListener('click',()=>{addBall(Number(select.value));});
document.getElementById('boost').addEventListener('click',()=>{for(const b of balls){b.vx*=1.8;b.vy*=1.8;} if(!balls.length)addBall(Number(select.value),3);});
document.getElementById('reset').addEventListener('click',()=>{balls=[];makeBlocks();addBall(0);addBall(1);addBall(2);status.textContent='Neustart!';});
makeBlocks(); addBall(0);addBall(1);addBall(2);draw();status.textContent='Bereit! Wähle ein Land und tippe auf „Kugel hinzufügen“.';
requestAnimationFrame(update);
})();
</script>
</body>
</html>
